<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  docs/shop-welcome-kit-2026-11: fontconfig for the shop banner (render.ts points
  FONTCONFIG_FILE here when the process has none). Without a config file, sharp's
  bundled fontconfig cannot load the font in this folder (Poppins Bold, Latin +
  Devanagari) and the name falls back to another font, or to boxes for Hindi and
  Marathi names on a server without Devanagari fonts.
  The system's own config is kept when there is one (additive).
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">.</dir>
  <cachedir>/tmp/gokesari-fontconfig-cache</cachedir>
</fontconfig>
