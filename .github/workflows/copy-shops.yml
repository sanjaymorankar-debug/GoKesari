# Copy shops to production — gokesari.com. BY HAND ONLY.
# Setup and use: docs/copy-shops-2026-10/README.md
#
# Actions → "Copy shops to production" → Run workflow → branch main:
#   plan   reads the chosen shops from the test database and does the whole
#          copy inside one production transaction, then rolls it back: the
#          summary shows exactly what would be added, and production is not
#          changed
#   copy   the same, saved; needs confirm = COPY SHOPS TO PRODUCTION
#
# Two jobs, so each database's password is given to one job only: "export"
# runs in the test environment and only reads the test database; "copy" runs
# in the production environment and only reads the export. The export passes
# between them as a private artifact kept for one day.
#
# There is no push or schedule trigger: nothing here runs on its own.
name: Copy shops to production

on:
  workflow_dispatch:
    inputs:
      mode:
        description: plan (nothing saved) or copy (saved to PRODUCTION)
        type: choice
        default: plan
        options: [plan, copy]
      shops:
        description: Registration numbers ON TEST, comma-separated
        required: true
        # Agtci, Asmy Exports, Chikan Shop, EcoMed Solutions, Samarth tea center — the owner's choice of 11 Oct 2026.
        default: BKS-000001,BKS-000004,BKS-000007,BKS-000013,BKS-000018
      confirm:
        description: "copy only: type COPY SHOPS TO PRODUCTION"
        required: false
        default: ""

# Shares the production database workflow's queue: never two production runs at once.
concurrency:
  group: prod-db
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  export:
    # Only the reviewed copy of this file on main may run.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test
    outputs:
      test_host: ${{ steps.guard.outputs.test_host }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Guard — test database, read only
        id: guard
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          EXPECTED_HOST: ${{ vars.TEST_DATABASE_HOST }}
          EXPECTED_DB: ${{ vars.TEST_DATABASE_NAME }}
          READ_ONLY: "true"
        run: |
          scripts/test-db/guard.sh
          echo "test_host=${EXPECTED_HOST}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install (no secrets, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Export the shops from test
        env:
          MODE: export
          SOURCE_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          SHOPS: ${{ inputs.shops }}
          SOURCE_SITE: https://test.gokesari.com
          BUNDLE_FILE: ${{ runner.temp }}/shops.json
        run: npx tsx scripts/copy-shops/copy-shops.ts | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: shops-export
          path: ${{ runner.temp }}/shops.json
          retention-days: 1
          if-no-files-found: error

  copy:
    needs: export
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Sees repository secrets and, if it exists, the production environment's.
    environment: production
    env:
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Guard — production, by hand, confirmed
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          EXPECTED_HOST: ${{ vars.PROD_DATABASE_HOST }}
          EXPECTED_DB: ${{ vars.PROD_DATABASE_NAME }}
          TEST_HOST: ${{ needs.export.outputs.test_host }}
          CONFIRM: ${{ inputs.confirm }}
        run: scripts/copy-shops/guard.sh

      - name: Restore point
        if: inputs.mode == 'copy'
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          at=$(psql "$PROD_DATABASE_URL" -X -v ON_ERROR_STOP=1 -tAc "select to_char(now() at time zone 'UTC', 'YYYY-MM-DD HH24:MI:SS') || ' UTC'")
          lsn=$(psql "$PROD_DATABASE_URL" -X -tAc "select pg_current_wal_lsn()" 2>/dev/null || echo "not available")
          {
            echo "### Restore point (before copying)"
            echo "Time **$at** · LSN \`$lsn\`"
            echo
            echo "To undo: Neon console → the production project → Restore → to this time (docs/event-driven-2026-10/PROD_DB.md)."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install (no secrets, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: actions/download-artifact@v4
        with:
          name: shops-export
          path: ${{ runner.temp }}/export

      - name: ${{ inputs.mode == 'copy' && 'Copy the shops to production' || 'Plan the copy (rolled back)' }}
        env:
          TARGET_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BUNDLE_FILE: ${{ runner.temp }}/export/shops.json
          REPORT_FILE: ${{ runner.temp }}/report.md
        run: |
          npx tsx scripts/copy-shops/copy-shops.ts
          cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
