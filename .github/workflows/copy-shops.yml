# Copy shops to production — gokesari.com. BY HAND ONLY.
# Setup and use: docs/copy-shops-2026-10/README.md
#
# Actions → "Copy shops to production" → Run workflow → branch main:
#   plan   reads the chosen shops from the test database and does the whole
#          copy inside one production transaction, then rolls it back: the
#          summary shows exactly what would be added, and production is not
#          changed
#   copy   the same, saved; needs confirm = COPY SHOPS TO PRODUCTION
#   sql    no production access at all: turns the export into two SQL files
#          (PREVIEW, then APPLY) to run by hand against production — same
#          rules, carried out inside the database. Production on Neon: Neon
#          console → SQL Editor. Production on GoKesari's own database server
#          (VPS): psql from the owner's Mac over WireGuard.
#
# Two jobs, so each database's password is given to one job only: "export"
# runs in the test environment and only reads the test database; "copy" runs
# in the production environment and only reads the export. The export passes
# between them as a private artifact kept for one day.
#
# Where each database lives is read from its host variable: TEST_DATABASE_HOST
# (test environment) for "export", PROD_DATABASE_HOST (production environment)
# for "copy". A .neon.tech host is reached directly, as before. Any other host
# is GoKesari's own database server (VPS; docs/neon-to-vps-2026-11/): the job
# first joins the server's WireGuard network with a key of its own, before any
# step that touches the database, and points that host name at the server.
#   export  peer gh-copy-shops-export (10.66.0.22): the staging database (5433)
#           only. Secret VPS_WG_KEY_COPY_SHOPS_EXPORT on `test`.
#   copy    peer gh-copy-shops (10.66.0.24): production (5432) and the snapshot
#           command. Secrets VPS_WG_KEY_COPY_SHOPS and VPS_SSH_KEY_COPY_SHOPS on
#           `production`, and PROD_DATABASE_HOST must be set.
# Both environments also need the variables VPS_WG_SERVER_PUBLIC_KEY and
# VPS_WG_ENDPOINT; production needs VPS_SSH_KNOWN_HOSTS. A host whose port is
# not 5432 is written host:port (TEST_DATABASE_HOST = db-test.gokesari.com:5433).
#
# Before a copy is saved, the run records the point an undo would go back to:
# on Neon the time and WAL position (Neon → Restore to that time); on the VPS a
# snapshot on the server and a restore point of the same name
# (docs/neon-to-vps-2026-11/RUNBOOK.md, "Restores").
#
# There is no push or schedule trigger: nothing here runs on its own.
name: Copy shops to production

on:
  workflow_dispatch:
    inputs:
      mode:
        description: plan (nothing saved), copy (saved to PRODUCTION), or sql (SQL files to run by hand — Neon console, or psql over WireGuard)
        type: choice
        default: plan
        options: [plan, copy, sql]
      shops:
        description: Registration numbers ON TEST, comma-separated
        required: true
        # Agtci, Asmy Exports, Chikan Shop, EcoMed Solutions, Samarth tea center — the owner's choice of 11 Oct 2026.
        default: BKS-000001,BKS-000004,BKS-000007,BKS-000013,BKS-000018
      confirm:
        description: "copy only: type COPY SHOPS TO PRODUCTION"
        required: false
        default: ""

# Shares the production database workflow's queue: never two production runs at once.
concurrency:
  group: prod-db
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  export:
    # Only the reviewed copy of this file on main may run.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test
    outputs:
      test_host: ${{ steps.guard.outputs.test_host }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Plan — where the test database is
        env:
          TEST_HOST: ${{ vars.TEST_DATABASE_HOST }}
        run: |
          case "${TEST_HOST%%:*}" in
            "") provider=unset ;;           # the guard stops the run and says why
            *.neon.tech) provider=neon ;;   # Neon: reached directly, as before
            *) provider=vps ;;              # GoKesari's own server: over WireGuard
          esac
          hosts=""
          if [ "$provider" = vps ]; then
            [[ "$TEST_HOST" =~ ^[A-Za-z0-9.-]+(:[0-9]{1,5})?$ ]] || { echo "::error::Variable TEST_DATABASE_HOST must be a host name or host:port (it is '$TEST_HOST'). Stopping before any change."; exit 1; }
            hosts=$TEST_HOST
          fi
          { echo "DB_PROVIDER=$provider"; echo "VPS_HOSTS=$hosts"; } >> "$GITHUB_ENV"
          echo "Test database: $provider${hosts:+ ($hosts, over WireGuard)}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Connect to the database server (WireGuard)
        if: env.DB_PROVIDER == 'vps'
        # Peer gh-copy-shops-export (10.66.0.22): the staging database (5433) only, no SSH.
        uses: ./.github/actions/vps-db-tunnel
        with:
          private-key: ${{ secrets.VPS_WG_KEY_COPY_SHOPS_EXPORT }}
          private-key-name: VPS_WG_KEY_COPY_SHOPS_EXPORT
          peer: gh-copy-shops-export
          address: 10.66.0.22
          server-public-key: ${{ vars.VPS_WG_SERVER_PUBLIC_KEY }}
          endpoint: ${{ vars.VPS_WG_ENDPOINT }}
          hosts: ${{ env.VPS_HOSTS }}
          environment: test

      - name: Guard — test database, read only
        id: guard
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          EXPECTED_HOST: ${{ vars.TEST_DATABASE_HOST }}
          EXPECTED_DB: ${{ vars.TEST_DATABASE_NAME }}
          READ_ONLY: "true"
        run: |
          scripts/test-db/guard.sh
          echo "test_host=${EXPECTED_HOST}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install (no secrets, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Export the shops from test
        env:
          MODE: export
          SOURCE_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          SHOPS: ${{ inputs.shops }}
          SOURCE_SITE: https://test.gokesari.com
          BUNDLE_FILE: ${{ runner.temp }}/shops.json
        run: npx tsx scripts/copy-shops/copy-shops.ts | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: shops-export
          path: ${{ runner.temp }}/shops.json
          retention-days: 1
          if-no-files-found: error

      - name: Disconnect from the database server
        if: always() && env.DB_PROVIDER == 'vps'
        # The key file was removed by the step that wrote it; this closes the tunnel.
        run: sudo ip link delete dev gkdb 2>/dev/null || true

  sql:
    needs: export
    if: github.ref == 'refs/heads/main' && inputs.mode == 'sql'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No database secret here: the files are made from the export alone.
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install (no secrets, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: actions/download-artifact@v4
        with:
          name: shops-export
          path: ${{ runner.temp }}/export

      - name: Make the SQL files
        env:
          BUNDLE_FILE: ${{ runner.temp }}/export/shops.json
          OUT_DIR: ${{ runner.temp }}/sql
        run: |
          npx tsx scripts/copy-shops/to-sql.ts
          {
            echo "### SQL files ready"
            echo "Download **copy-shops-sql** below (Artifacts) and unzip it. Run the files against PRODUCTION, the way that fits where it is:"
            echo "- **On Neon:** Neon console → the PRODUCTION project → SQL Editor → paste the whole file → Run."
            echo "- **On GoKesari's own database server (VPS):** on the owner's Mac with the WireGuard tunnel on, \`psql \"host=10.66.0.1 port=5432 dbname=gokesari user=gokesari_app sslmode=require\" -X -v ON_ERROR_STOP=1 -f <file>\` (the password is in the password manager)."
            echo
            echo "1. run \`copy-shops-1-PREVIEW.sql\` — changes nothing, lists what would happen;"
            echo "2. if that is right, note the time, then run \`copy-shops-2-APPLY.sql\` — saves the shops."
            echo
            echo "To undo an APPLY: on Neon, Neon console → the production project → Restore → to the time you noted; on the VPS, restore to that time (docs/neon-to-vps-2026-11/RUNBOOK.md, \"Restores\": destructive, owner's OK first)."
            echo
            echo "The files hold the shops' owner contact details: kept 3 days, then deleted. docs/copy-shops-2026-10/README.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: copy-shops-sql
          path: ${{ runner.temp }}/sql/*.sql
          retention-days: 3
          if-no-files-found: error

  copy:
    needs: export
    if: github.ref == 'refs/heads/main' && inputs.mode != 'sql'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Sees repository secrets and, if it exists, the production environment's.
    environment: production
    env:
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Plan — where production is
        env:
          PROD_HOST: ${{ vars.PROD_DATABASE_HOST }}
        run: |
          case "${PROD_HOST%%:*}" in
            "") provider=unset ;;           # Neon as before; the guard refuses any other URL host
            *.neon.tech) provider=neon ;;   # Neon: reached directly, as before
            *) provider=vps ;;              # GoKesari's own server: over WireGuard
          esac
          hosts=""
          if [ "$provider" = vps ]; then
            [[ "$PROD_HOST" =~ ^[A-Za-z0-9.-]+(:[0-9]{1,5})?$ ]] || { echo "::error::Variable PROD_DATABASE_HOST must be a host name or host:port (it is '$PROD_HOST'). Stopping before any change."; exit 1; }
            hosts=$PROD_HOST
          fi
          { echo "DB_PROVIDER=$provider"; echo "VPS_HOSTS=$hosts"; } >> "$GITHUB_ENV"
          echo "Production database: $provider${hosts:+ ($hosts, over WireGuard)}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Connect to the database server (WireGuard)
        if: env.DB_PROVIDER == 'vps'
        # Peer gh-copy-shops (10.66.0.24): production (5432) and the snapshot command (SSH).
        uses: ./.github/actions/vps-db-tunnel
        with:
          private-key: ${{ secrets.VPS_WG_KEY_COPY_SHOPS }}
          private-key-name: VPS_WG_KEY_COPY_SHOPS
          peer: gh-copy-shops
          address: 10.66.0.24
          server-public-key: ${{ vars.VPS_WG_SERVER_PUBLIC_KEY }}
          endpoint: ${{ vars.VPS_WG_ENDPOINT }}
          hosts: ${{ env.VPS_HOSTS }}
          environment: production

      - name: Guard — production, by hand, confirmed
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          EXPECTED_HOST: ${{ vars.PROD_DATABASE_HOST }}
          EXPECTED_DB: ${{ vars.PROD_DATABASE_NAME }}
          TEST_HOST: ${{ needs.export.outputs.test_host }}
          CONFIRM: ${{ inputs.confirm }}
        run: scripts/copy-shops/guard.sh

      - name: Restore point (Neon)
        if: inputs.mode == 'copy' && env.DB_PROVIDER != 'vps'
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          at=$(psql "$PROD_DATABASE_URL" -X -v ON_ERROR_STOP=1 -tAc "select to_char(now() at time zone 'UTC', 'YYYY-MM-DD HH24:MI:SS') || ' UTC'")
          lsn=$(psql "$PROD_DATABASE_URL" -X -tAc "select pg_current_wal_lsn()" 2>/dev/null || echo "not available")
          {
            echo "### Restore point (before copying)"
            echo "Time **$at** · LSN \`$lsn\`"
            echo
            echo "To undo: Neon console → the production project → Restore → to this time (docs/event-driven-2026-10/PROD_DB.md)."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Restore point (database server snapshot)
        if: inputs.mode == 'copy' && env.DB_PROVIDER == 'vps'
        # A dump on the server plus a restore point named copy-shops-<date>-run<N>;
        # no rows leave the server. Stops the run before copying if it fails.
        uses: ./.github/actions/vps-db-snapshot
        with:
          ssh-key: ${{ secrets.VPS_SSH_KEY_COPY_SHOPS }}
          ssh-key-name: VPS_SSH_KEY_COPY_SHOPS
          known-hosts: ${{ vars.VPS_SSH_KNOWN_HOSTS }}
          environment: production
          name-prefix: copy-shops
          title: Restore point (before copying)

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install (no secrets, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: actions/download-artifact@v4
        with:
          name: shops-export
          path: ${{ runner.temp }}/export

      - name: ${{ inputs.mode == 'copy' && 'Copy the shops to production' || 'Plan the copy (rolled back)' }}
        env:
          TARGET_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BUNDLE_FILE: ${{ runner.temp }}/export/shops.json
          REPORT_FILE: ${{ runner.temp }}/report.md
        run: |
          npx tsx scripts/copy-shops/copy-shops.ts
          cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Disconnect from the database server
        if: always() && env.DB_PROVIDER == 'vps'
        # The key files were removed by the steps that wrote them; this closes the tunnel.
        run: sudo ip link delete dev gkdb 2>/dev/null || true
