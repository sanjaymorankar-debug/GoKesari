# Seller / customer database split (Task 1) — BY HAND ONLY.
# Setup and use: docs/db-split-2026-10/README.md
#
# Actions → "Database split" → Run workflow:
#   plan       read-only: ownership of every table and the cross-database links
#   dry-run    read-only: checks the three databases are reachable and distinct
#   migrate    builds gokesari_seller + gokesari_customer from the source and
#              copies every row, then verifies (row counts, checksums, links)
#   verify     read-only: re-runs the verification report
#   fdw        sets up postgres_fdw both ways (cross-database reads)
#
# Target "test" (test.gokesari.com) runs from staging. Target "production"
# runs only from main, only after a passing test run, and needs
# confirm = SPLIT PRODUCTION. The SOURCE database is only ever read: the
# site keeps running on it (DB_SPLIT_MODE=single) until the switch in the
# README, so nothing here can take the site down or lose data.
#
# Secrets, per environment ("test" / "production"):
#   TEST_DATABASE_URL / PROD_DATABASE_URL            the current (source) database
#   TEST_SELLER_DATABASE_URL / PROD_SELLER_DATABASE_URL       the new gokesari_seller   ← PLACEHOLDER until shared
#   TEST_CUSTOMER_DATABASE_URL / PROD_CUSTOMER_DATABASE_URL   the new gokesari_customer ← PLACEHOLDER until shared
name: Database split

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which site's databases
        type: choice
        default: test
        options: [test, production]
      action:
        description: What to do
        type: choice
        default: plan
        options: [plan, dry-run, migrate, verify, fdw]
      replace:
        description: "migrate only: overwrite a target that already has data"
        type: boolean
        default: false
      confirm:
        description: "production migrate/fdw only: type SPLIT PRODUCTION"
        required: false
        default: ""

concurrency:
  group: db-split-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.target == 'production' && 'production' || 'test' }}
    steps:
      - name: Guard
        env:
          TARGET: ${{ inputs.target }}
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          if [ "$TARGET" = "production" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] || fail "Production runs only from main."
            case "$ACTION" in migrate|fdw) [ "$CONFIRM" = "SPLIT PRODUCTION" ] || fail "Type SPLIT PRODUCTION in confirm to change production databases." ;; esac
          else
            [ "$GITHUB_REF" = "refs/heads/staging" ] || [ "$ACTION" = "plan" ] || [ "$ACTION" = "verify" ] || fail "Test-site changes run only from staging."
          fi

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install (no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Connection settings
        env:
          TARGET: ${{ inputs.target }}
          T_SRC: ${{ secrets.TEST_DATABASE_URL }}
          T_SELLER: ${{ secrets.TEST_SELLER_DATABASE_URL }}
          T_CUSTOMER: ${{ secrets.TEST_CUSTOMER_DATABASE_URL }}
          P_SRC: ${{ secrets.PROD_DATABASE_URL }}
          P_SELLER: ${{ secrets.PROD_SELLER_DATABASE_URL }}
          P_CUSTOMER: ${{ secrets.PROD_CUSTOMER_DATABASE_URL }}
        run: |
          if [ "$TARGET" = "production" ]; then src=$P_SRC; seller=$P_SELLER; customer=$P_CUSTOMER; else src=$T_SRC; seller=$T_SELLER; customer=$T_CUSTOMER; fi
          [ -n "$src" ] || { echo "::error::The source database secret is not set for $TARGET."; exit 1; }
          if [ "${{ inputs.action }}" != "plan" ]; then
            [ -n "$seller" ] || { echo "::error::Secret ${TARGET^^}_SELLER_DATABASE_URL is not set yet — the seller (gokesari_seller) database details are still to be shared. See docs/db-split-2026-10/README.md."; exit 1; }
            [ -n "$customer" ] || { echo "::error::Secret ${TARGET^^}_CUSTOMER_DATABASE_URL is not set yet. See docs/db-split-2026-10/README.md."; exit 1; }
          fi
          {
            echo "SOURCE_DATABASE_URL=$src"
            echo "SELLER_DATABASE_URL=$seller"
            echo "CUSTOMER_DATABASE_URL=$customer"
          } >> "$GITHUB_ENV"

      - name: Production only — the test split passed first
        if: inputs.target == 'production' && inputs.action == 'migrate'
        env:
          T_SRC: ${{ secrets.TEST_DATABASE_URL }}
          T_SELLER: ${{ secrets.TEST_SELLER_DATABASE_URL }}
          T_CUSTOMER: ${{ secrets.TEST_CUSTOMER_DATABASE_URL }}
        run: |
          [ -n "$T_SELLER" ] || { echo "::error::Split the test database first."; exit 1; }
          SOURCE_DATABASE_URL="$T_SRC" SELLER_DATABASE_URL="$T_SELLER" CUSTOMER_DATABASE_URL="$T_CUSTOMER" \
            npx tsx scripts/db-split/run.ts verify --allow-remote > /dev/null || { echo "::error::The test split does not verify cleanly. Fix it there first."; exit 1; }

      - name: Restore point (source)
        if: inputs.action == 'migrate'
        run: |
          at=$(psql "$SOURCE_DATABASE_URL" -X -v ON_ERROR_STOP=1 -tAc "select to_char(now() at time zone 'UTC', 'YYYY-MM-DD HH24:MI:SS') || ' UTC'")
          { echo "### Restore point"; echo "Source read at **$at**. The source is never written to; the site keeps using it until DB_SPLIT_MODE changes."; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run
        env:
          ACTION: ${{ inputs.action }}
          REPLACE: ${{ inputs.replace }}
        run: |
          extra=(--allow-remote)
          [ "$REPLACE" = "true" ] && extra+=(--replace)
          case "$ACTION" in
            plan) npx tsx scripts/db-split/run.ts plan "${extra[@]}" | tee -a "$GITHUB_STEP_SUMMARY" ;;
            dry-run) npx tsx scripts/db-split/run.ts migrate "${extra[@]}" | tee -a "$GITHUB_STEP_SUMMARY" ;;
            migrate) npx tsx scripts/db-split/run.ts migrate --apply --report "$RUNNER_TEMP/split-report.md" "${extra[@]}" ;;
            verify) npx tsx scripts/db-split/run.ts verify --report "$RUNNER_TEMP/split-report.md" "${extra[@]}" ;;
            fdw) npx tsx scripts/db-split/run.ts fdw --apply "${extra[@]}" | tee -a "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: Report
        if: always() && (inputs.action == 'migrate' || inputs.action == 'verify')
        run: '[ -f "$RUNNER_TEMP/split-report.md" ] && cat "$RUNNER_TEMP/split-report.md" >> "$GITHUB_STEP_SUMMARY" || true'

      - name: Keep the report
        if: always() && (inputs.action == 'migrate' || inputs.action == 'verify')
        uses: actions/upload-artifact@v4
        with:
          name: db-split-report-${{ inputs.target }}
          path: ${{ runner.temp }}/split-report.md
          if-no-files-found: ignore
          retention-days: 30
