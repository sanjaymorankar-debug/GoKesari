name: CI

# Runs the full suite on pushes and pull requests to main and staging. The
# integration tests need a real PostgreSQL, so one is provided as a service
# container — the guarantees they check (row locking, unique constraints, CHECK
# constraints) cannot be verified against a mock.
#
# To save Actions minutes (the monthly allowance ran out on 9 Oct 2026), the
# "scope" job first decides what a change needs (scripts/ci/scope.sh):
#   - the app jobs (checks, test, build) and mobile are skipped when the same files already passed CI on a
#     push (a release's PR and its merge into main repeat staging's run), or
#     when only documentation changed;
#   - the app jobs are skipped when only mobile/ changed, mobile when mobile/ didn't.
# A skipped job counts as passed. A newer push to a pull request cancels its
# older run; pushes to main and staging always finish.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read # scope: has this commit already passed CI?

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.scope.outputs.app }}
      mobile: ${{ steps.scope.outputs.mobile }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - id: scope
        run: bash scripts/ci/scope.sh
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}

      # The staging queue's error handling against a fake gh: a few seconds,
      # no npm install, so it rides along here instead of in a job of its own.
      - name: Staging queue script tests
        run: bash scripts/release/staging-queue.test.sh

  # The app is checked by three kinds of job that run side by side (24-Nov-2026:
  # one job doing everything took ~55 minutes, ~40 of them in the tests, which
  # made each PR in the staging queue take ~75 minutes):
  #   - checks: typecheck and lint;
  #   - test:   the unit and integration tests, split into shards by file
  #             (vitest --shard). Each shard has its own PostgreSQL, so the
  #             one-file-at-a-time rule in vitest.config.ts still holds inside
  #             a shard;
  #   - build:  the production build.
  # The repository is public, so these runners do not use the minutes allowance.
  checks:
    needs: scope
    if: needs.scope.outputs.app == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint src tests --ext .ts,.tsx

  test:
    needs: scope
    if: needs.scope.outputs.app == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: test (${{ matrix.shard }}/4)

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dairy_bakery_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dairy_bakery_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dairy_bakery_test
      AUTH_SECRET: ci-only-secret-not-used-in-production
      CRON_SECRET: ci-only-cron-secret

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Unit and integration tests (shard ${{ matrix.shard }} of 4)
        run: npx vitest run --shard=${{ matrix.shard }}/4

  build:
    needs: scope
    if: needs.scope.outputs.app == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dairy_bakery_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dairy_bakery_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dairy_bakery_test
      AUTH_SECRET: ci-only-secret-not-used-in-production
      CRON_SECRET: ci-only-cron-secret

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Production build
        run: npm run build
        env:
          # Same heap as the server's builds (scripts/vps-app/lib.sh, BUILD_NODE_OPTIONS):
          # Node's default ran out of memory here once GoKesari Health was added (20-Nov-2026). 28-Nov-2026 (#679):
          # 6 GB ran out on staging after #692 (heap ~5.3 GB); the runner has 16 GB, the server builds with 7 GB.
          NODE_OPTIONS: --max-old-space-size=8192

  mobile:
    # The Android/iOS app (mobile/): a separate Expo project with its own
    # dependencies. Native builds run on EAS (mobile/README.md); this checks
    # the code and that the JavaScript bundles for both platforms.
    needs: scope
    if: needs.scope.outputs.mobile == 'yes'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Bundle for Android and iOS
        run: npx expo export --platform android --platform ios --output-dir "$RUNNER_TEMP/expo-export"
