name: CI

# Runs the full suite on pushes and pull requests to main and staging. The
# integration tests need a real PostgreSQL, so one is provided as a service
# container — the guarantees they check (row locking, unique constraints, CHECK
# constraints) cannot be verified against a mock.
#
# To save Actions minutes (the monthly allowance ran out on 9 Oct 2026), the
# "scope" job first decides what a change needs (scripts/ci/scope.sh):
#   - test and mobile are skipped when the same files already passed CI on a
#     push (a release's PR and its merge into main repeat staging's run), or
#     when only documentation changed;
#   - test is skipped when only mobile/ changed, mobile when mobile/ didn't.
# A skipped job counts as passed. A newer push to a pull request cancels its
# older run; pushes to main and staging always finish.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read # scope: has this commit already passed CI?

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.scope.outputs.app }}
      mobile: ${{ steps.scope.outputs.mobile }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - id: scope
        run: bash scripts/ci/scope.sh
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}

  test:
    needs: scope
    if: needs.scope.outputs.app == 'yes'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dairy_bakery_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dairy_bakery_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dairy_bakery_test
      AUTH_SECRET: ci-only-secret-not-used-in-production
      CRON_SECRET: ci-only-cron-secret

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint src tests --ext .ts,.tsx

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

  # The same suite on the seller / customer split layout (two databases; seller
  # tables reached through postgres_fdw — docs/db-split-2026-10/CODE_SPLIT_PLAN.md),
  # so a change that works on one database but not across the two fails here.
  # PostgreSQL 18, the version of the sites' Neon databases: the switch and the
  # split behave differently from 16 in places (a partition's identity column).
  test-split:
    needs: scope
    if: needs.scope.outputs.app == 'yes'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dairy_bakery_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dairy_bakery_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dairy_bakery_test
      SELLER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dairy_bakery_seller
      DB_SPLIT_MODE: split
      AUTH_SECRET: ci-only-secret-not-used-in-production
      CRON_SECRET: ci-only-cron-secret

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations (core)
        run: npm run db:migrate

      - name: Build the split layout
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "create database dairy_bakery_seller"
          npx tsx scripts/db-split/test-layout.ts --core "$TEST_DATABASE_URL" --seller "$SELLER_DATABASE_URL"

      - name: Unit and integration tests (split layout)
        run: npm test

  mobile:
    # The Android/iOS app (mobile/): a separate Expo project with its own
    # dependencies. Native builds run on EAS (mobile/README.md); this checks
    # the code and that the JavaScript bundles for both platforms.
    needs: scope
    if: needs.scope.outputs.mobile == 'yes'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Bundle for Android and iOS
        run: npx expo export --platform android --platform ios --output-dir "$RUNNER_TEMP/expo-export"
