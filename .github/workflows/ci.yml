name: CI

# Runs the full suite on every push and pull request. The integration tests need
# a real PostgreSQL, so one is provided as a service container — the guarantees
# they check (row locking, unique constraints, CHECK constraints) cannot be
# verified against a mock.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dairy_bakery_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dairy_bakery_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dairy_bakery_test
      AUTH_SECRET: ci-only-secret-not-used-in-production
      CRON_SECRET: ci-only-cron-secret

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint src tests --ext .ts,.tsx

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

  mobile:
    # The Android/iOS app (mobile/): a separate Expo project with its own
    # dependencies. Native builds run on EAS (mobile/README.md); this checks
    # the code and that the JavaScript bundles for both platforms.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Bundle for Android and iOS
        run: npx expo export --platform android --platform ios --output-dir "$RUNNER_TEMP/expo-export"
